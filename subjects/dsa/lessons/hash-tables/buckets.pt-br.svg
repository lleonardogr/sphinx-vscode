<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="As chaves 12, 7, 15 e 9 vão para o balde chave % 5: 15 para o balde 0, 9 para o balde 4, e 12 e 7 para o balde 2, onde colidem e formam uma lista curta">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .k { font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #8a94a6; }
    .i { font-size: 15px; fill: #8a94a6; text-anchor: middle; }
    .v { font-size: 17px; font-weight: 700; text-anchor: middle; }
    .e { font-size: 13px; fill: #8a94a6; font-style: italic; }
    .t { font-size: 15px; font-weight: 700; fill: #3b82f6; }
    .c { font-size: 14px; font-weight: 700; fill: #f59e0b; }
  </style>
  <text x="40" y="30" class="t">índice = chave % 5</text>
  <text x="40" y="62" class="k">12 % 5 = 2</text>
  <text x="40" y="100" class="k">7 % 5 = 2</text>
  <text x="40" y="138" class="k">15 % 5 = 0</text>
  <text x="40" y="176" class="k">9 % 5 = 4</text>
  <rect x="300" y="30" width="40" height="32" rx="4" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="320" y="52" class="i">0</text>
  <path d="M342 46 H356" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="360" y="30" width="52" height="32" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="386" y="52" class="v" fill="#3b82f6">15</text>
  <rect x="300" y="70" width="40" height="32" rx="4" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="320" y="92" class="i">1</text>
  <text x="356" y="91" class="e">vazio</text>
  <rect x="300" y="110" width="40" height="32" rx="4" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="320" y="132" class="i">2</text>
  <path d="M342 126 H356" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="360" y="110" width="52" height="32" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="386" y="132" class="v" fill="#f59e0b">12</text>
  <path d="M422 126 H436" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="440" y="110" width="52" height="32" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="466" y="132" class="v" fill="#f59e0b">7</text>
  <rect x="300" y="150" width="40" height="32" rx="4" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="320" y="172" class="i">3</text>
  <text x="356" y="171" class="e">vazio</text>
  <rect x="300" y="190" width="40" height="32" rx="4" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="320" y="212" class="i">4</text>
  <path d="M342 206 H356" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="360" y="190" width="52" height="32" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="386" y="212" class="v" fill="#3b82f6">9</text>
  <text x="530" y="136" class="c">← colisão</text>
</svg>
