<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" role="img" aria-label="In the sorted array 2 4 4 4 7 9, the first value at least 4 is at index 1 and the first value greater than 4 is at index 4, so 4 − 1 = 3 values equal 4">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; text-anchor: middle; }
    .v { font-size: 20px; font-weight: 700; }
    .i { font-size: 13px; fill: #8a94a6; }
    .a { font-size: 15px; font-weight: 700; fill: #f59e0b; }
    .c { font-size: 15px; font-weight: 700; fill: #3b82f6; }
  </style>
  <rect x="110" y="70" width="60" height="50" rx="4" fill="none" fill-opacity="0.18" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="140" y="102" class="v" fill="#8a94a6">2</text>
  <text x="140" y="142" class="i">0</text>
  <rect x="170" y="70" width="60" height="50" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="102" class="v" fill="#3b82f6">4</text>
  <text x="200" y="142" class="i">1</text>
  <rect x="230" y="70" width="60" height="50" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="102" class="v" fill="#3b82f6">4</text>
  <text x="260" y="142" class="i">2</text>
  <rect x="290" y="70" width="60" height="50" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="102" class="v" fill="#3b82f6">4</text>
  <text x="320" y="142" class="i">3</text>
  <rect x="350" y="70" width="60" height="50" rx="4" fill="none" fill-opacity="0.18" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="380" y="102" class="v" fill="#8a94a6">7</text>
  <text x="380" y="142" class="i">4</text>
  <rect x="410" y="70" width="60" height="50" rx="4" fill="none" fill-opacity="0.18" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="440" y="102" class="v" fill="#8a94a6">9</text>
  <text x="440" y="142" class="i">5</text>
  <text x="96" y="142" class="i" style="text-anchor: end">index</text>
  <text x="200" y="26" class="a">first ≥ 4: index 1</text>
  <path d="M200 34 V60" stroke="#f59e0b" stroke-width="2"/>
  <path d="M194 56 L200 66 L206 56 Z" fill="#f59e0b"/>
  <text x="380" y="26" class="a">first > 4: index 4</text>
  <path d="M380 34 V60" stroke="#f59e0b" stroke-width="2"/>
  <path d="M374 56 L380 66 L386 56 Z" fill="#f59e0b"/>
  <path d="M172 152 V160 H348 V152" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <text x="260" y="186" class="c">count of 4s = 4 − 1 = 3</text>
</svg>
