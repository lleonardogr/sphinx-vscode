<text x="16" y="50" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">intervalo 1..49</text>
<text x="16" y="70" fill="#f59e0b" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">chute 25: pequeno demais</text>
