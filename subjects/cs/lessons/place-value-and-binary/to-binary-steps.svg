<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 236" role="img" aria-label="Converting 13 to binary by dividing by 2: the remainders 1, 0, 1, 1 read backwards give 1101">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="16" y="50" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">13 ÷ 2 = 6  r 1</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Divide by 2: the remainder is</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">the last bit</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="16" y="50" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">13 ÷ 2 = 6  r 1</text>
<text x="16" y="70" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"> 6 ÷ 2 = 3  r 0</text>
<text x="16" y="90" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"> 3 ÷ 2 = 1  r 1</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Keep dividing the quotient</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="16" y="50" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">13 ÷ 2 = 6  r 1</text>
<text x="16" y="70" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"> 6 ÷ 2 = 3  r 0</text>
<text x="16" y="90" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"> 3 ÷ 2 = 1  r 1</text>
<text x="16" y="110" fill="#f59e0b" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"> 1 ÷ 2 = 0  r 1</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Stop when the quotient is 0</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<rect x="68.0" y="84" width="22" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="79.0" y="102.68" fill="#3b82f6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">1</text>
<text x="79.0" y="126" fill="#8a94a6" font-size="9" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">8</text>
<rect x="92.0" y="84" width="22" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="103.0" y="102.68" fill="#3b82f6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">1</text>
<text x="103.0" y="126" fill="#8a94a6" font-size="9" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<rect x="116.0" y="84" width="22" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="127.0" y="102.68" fill="#3b82f6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">0</text>
<text x="127.0" y="126" fill="#8a94a6" font-size="9" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<rect x="140.0" y="84" width="22" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="151.0" y="102.68" fill="#3b82f6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">1</text>
<text x="151.0" y="126" fill="#8a94a6" font-size="9" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="115.0" y="62" fill="#8a94a6" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">8 + 4 + 1 = 13</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Read the remainders from the</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">last to the first: 13 = 1101</text>
</g>
</svg>
