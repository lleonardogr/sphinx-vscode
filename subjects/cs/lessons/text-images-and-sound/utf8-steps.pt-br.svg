<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 251" role="img" aria-label="Codificando é, code point U+00E9, em UTF-8: os 11 bits preenchem o padrão 110xxxxx 10xxxxxx, dando os bytes C3 A9">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="16" y="50" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">é = U+00E9</text>
<text x="16" y="70" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  = 233</text>
<text x="16" y="90" fill="#f59e0b" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  = 11101001</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">é tem o code point U+00E9: 8</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">bits, demais para um byte de</text>
<text x="115.0" y="236" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">UTF-8</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="16" y="50" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">110xxxxx 10xxxxxx</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Padrão de dois bytes: espaço</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">para 5 + 6 bits</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="16" y="50" fill="#f59e0b" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">   00011   101001</text>
<text x="16" y="70" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">110xxxxx 10xxxxxx</text>
<text x="16" y="90" fill="#10b981" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">11000011 10101001</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Complete os bits até 11 e</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">preencha os x</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<text x="16" y="50" fill="#10b981" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">11000011 10101001</text>
<text x="16" y="70" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">   C3       A9</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">é é guardado como os bytes C3</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">A9</text>
</g>
</svg>
