<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 236" role="img" aria-label="Com age 70, o Java testa age &lt; 12 (falso), depois age &gt;= 65 (verdadeiro), roda esse bloco e pula o else">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="16" y="50.0" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">int age = 70;</text>
<text x="16" y="68.5" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if (age &lt; 12)       → ?</text>
<text x="16" y="87.0" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">else if (age &gt;= 65) → ?</text>
<text x="16" y="105.5" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ticket = &quot;senior&quot;;</text>
<text x="16" y="124.0" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">else                → ?</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">O Java testa as condições de</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">cima para baixo</text>
</g>
