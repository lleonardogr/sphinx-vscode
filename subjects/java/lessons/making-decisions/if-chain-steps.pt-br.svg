<text x="16" y="87.0" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">else if (age &gt;= 65) → true</text>
<text x="16" y="105.5" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ticket = &quot;senior&quot;;</text>
