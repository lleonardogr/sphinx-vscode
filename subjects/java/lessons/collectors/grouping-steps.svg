<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 236" role="img" aria-label="groupingBy takes each city, computes its first letter as the key, and puts cities with the same key in the same list; with counting(), each group becomes its size">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="16" y="50" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Lima Lisbon Paris</text>
<text x="16" y="70" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Porto Rome</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">The stream of cities</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="16" y="50.0" fill="#f59e0b" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Lima   → L</text>
<text x="16" y="68.5" fill="#f59e0b" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Lisbon → L</text>
<text x="16" y="87.0" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Paris  → P</text>
<text x="16" y="105.5" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Porto  → P</text>
<text x="16" y="124.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Rome   → R</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">groupingBy computes a key for</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">each item: its first letter</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="16" y="50.0" fill="#f59e0b" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">L → [Lima, Lisbon]</text>
<text x="16" y="68.5" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">P → [Paris, Porto]</text>
<text x="16" y="87.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">R → [Rome]</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Items with the same key go to</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">the same list</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<text x="16" y="50.0" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">groupingBy(key,</text>
<text x="16" y="68.5" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  counting())</text>
<text x="16" y="87.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text>
<text x="16" y="105.5" fill="#10b981" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">L → 2, P → 2, R → 1</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">A second collector turns each</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">group into something else</text>
</g>
</svg>
