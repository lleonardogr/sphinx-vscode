<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 236" role="img" aria-label="int x = 5 lives at 0x1000; p = &amp;x stores that address; *p = 9 writes 9 into x through the pointer">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="125" y="22" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">int x = 5;</text>
<text x="55" y="66" fill="#f59e0b" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">x</text>
<rect x="25" y="74" width="60" height="32" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="55.0" y="95.4" fill="#f59e0b" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">5</text>
<text x="55" y="124" fill="#8a94a6" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0x1000</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">x is a box at some address,</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">here 0x1000</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="125" y="22" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">int *p = &amp;x;</text>
<text x="55" y="66" fill="#3b82f6" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">x</text>
<rect x="25" y="74" width="60" height="32" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="55.0" y="95.4" fill="#3b82f6" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">5</text>
<text x="55" y="124" fill="#8a94a6" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0x1000</text>
<text x="170" y="66" fill="#3b82f6" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">p</text>
<rect x="135" y="74" width="70" height="32" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="93.96" fill="#3b82f6" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">0x1000</text>
<text x="170" y="124" fill="#8a94a6" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0x1008</text>
<path d="M134.0 90.0 L96.0 90.0" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
<path d="M88.0 90.0 L96.0 85.5 L96.0 94.5 Z" fill="#3b82f6"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">p holds x&#x27;s address: p points</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">to x</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="125" y="22" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">*p = 9;</text>
<text x="55" y="66" fill="#f59e0b" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">x</text>
<rect x="25" y="74" width="60" height="32" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="55.0" y="95.4" fill="#f59e0b" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">9</text>
<text x="55" y="124" fill="#8a94a6" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0x1000</text>
<text x="170" y="66" fill="#3b82f6" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">p</text>
<rect x="135" y="74" width="70" height="32" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="93.96" fill="#3b82f6" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">0x1000</text>
<text x="170" y="124" fill="#8a94a6" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0x1008</text>
<path d="M134.0 90.0 L96.0 90.0" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
<path d="M88.0 90.0 L96.0 85.5 L96.0 94.5 Z" fill="#3b82f6"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">*p is &quot;the box p points to&quot;: x</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">becomes 9</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<text x="16" y="50" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">printf(&quot;%d&quot;, x);</text>
<text x="16" y="70" fill="#10b981" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">9</text>
<text x="16" y="90" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text>
<text x="16" y="110" fill="#3b82f6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">p  → 0x1000</text>
<text x="16" y="130" fill="#f59e0b" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">*p → 9</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">x changed without its name</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">being used</text>
</g>
</svg>
