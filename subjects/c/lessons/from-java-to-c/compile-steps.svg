<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 251" role="img" aria-label="hello.c is preprocessed, compiled and linked by gcc into machine code, which the CPU runs directly, unlike Java&#x27;s bytecode on the JVM">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="16" y="50.0" fill="#8a94a6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">// hello.c</text>
<text x="16" y="68.5" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">#include &lt;stdio.h&gt;</text>
<text x="16" y="87.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text>
<text x="16" y="105.5" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">int main(void) {</text>
<text x="16" y="124.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    printf(&quot;hi\n&quot;);</text>
<text x="16" y="142.5" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    return 0;</text>
<text x="16" y="161.0" fill="#3b82f6" font-size="11.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">}</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">You write the source code</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="16" y="50" fill="#f59e0b" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">gcc hello.c -o hello</text>
<text x="16" y="68" fill="#3b82f6" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text>
<text x="16" y="86" fill="#3b82f6" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">1. preprocess #include</text>
<text x="16" y="104" fill="#3b82f6" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">2. compile to machine code</text>
<text x="16" y="122" fill="#3b82f6" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">3. link in printf</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">gcc turns it into machine code</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">for this CPU</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="16" y="50" fill="#8a94a6" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">$ ./hello</text>
<text x="16" y="70" fill="#10b981" font-size="13" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">hi</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">The CPU runs the program</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">directly: no JVM in between</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="249.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<text x="16" y="50" fill="#3b82f6" font-size="12" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Java: .java → .class</text>
<text x="16" y="69" fill="#3b82f6" font-size="12" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">      → JVM</text>
<text x="16" y="88" fill="#3b82f6" font-size="12" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text>
<text x="16" y="107" fill="#10b981" font-size="12" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">C:    .c → program</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">Java ships bytecode for a</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">virtual machine; C ships</text>
<text x="115.0" y="236" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">machine code</text>
</g>
</svg>
