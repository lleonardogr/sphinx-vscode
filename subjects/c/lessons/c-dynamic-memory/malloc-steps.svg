<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 486" role="img" aria-label="malloc reserves a block in the heap, realloc grows it (maybe moving it), and free gives it back while the pointer keeps the old address until it is set to NULL">
<g transform="translate(0 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">1</text>
<text x="129.0" y="22" fill="#f59e0b" font-size="9.1" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">int *a = malloc(3 * sizeof(int));</text>
<text x="56" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">stack</text>
<text x="166" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">heap</text>
<path d="M113 42 L113 184" stroke="#8a94a6" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<rect x="124" y="58" width="98" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="173.0" y="73.96" fill="#f59e0b" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">[?, ?, ?]</text>
<text x="10" y="74.0" fill="#f59e0b" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a</text>
<rect x="58" y="58" width="40" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="78" cy="70.0" r="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M81.0 70.0 L115.0 70.0" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<path d="M123.0 70.0 L115.0 74.5 L115.0 65.5 Z" fill="#f59e0b"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">malloc reserves a block; its</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">values are garbage</text>
</g>
<g transform="translate(244 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">2</text>
<text x="129.0" y="22" fill="#f59e0b" font-size="10.3" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a[0] = 1; a[1] = 2; a[2] = 3;</text>
<text x="56" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">stack</text>
<text x="166" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">heap</text>
<path d="M113 42 L113 184" stroke="#8a94a6" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<rect x="124" y="58" width="98" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="173.0" y="73.96" fill="#f59e0b" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">[1, 2, 3]</text>
<text x="10" y="74.0" fill="#3b82f6" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a</text>
<rect x="58" y="58" width="40" height="24" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<circle cx="78" cy="70.0" r="3" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
<path d="M81.0 70.0 L115.0 70.0" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
<path d="M123.0 70.0 L115.0 74.5 L115.0 65.5 Z" fill="#3b82f6"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">The block is used like an</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">array</text>
</g>
<g transform="translate(488 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">3</text>
<text x="129.0" y="22" fill="#f59e0b" font-size="9.4" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a = realloc(a, 5 * sizeof(int));</text>
<text x="56" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">stack</text>
<text x="166" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">heap</text>
<path d="M113 42 L113 184" stroke="#8a94a6" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<rect x="124" y="58" width="98" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="173.0" y="73.96" fill="#f59e0b" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">[1,2,3,?,?]</text>
<text x="10" y="74.0" fill="#f59e0b" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a</text>
<rect x="58" y="58" width="40" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="78" cy="70.0" r="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M81.0 70.0 L115.0 70.0" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<path d="M123.0 70.0 L115.0 74.5 L115.0 65.5 Z" fill="#f59e0b"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">realloc may move the block;</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">the values come along</text>
</g>
<g transform="translate(732 0)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">4</text>
<text x="129.0" y="22" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">free(a);</text>
<text x="56" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">stack</text>
<text x="166" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">heap</text>
<path d="M113 42 L113 184" stroke="#8a94a6" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<text x="10" y="74.0" fill="#f59e0b" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a</text>
<rect x="58" y="58" width="40" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="78" cy="70.0" r="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">The block is given back, but a</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">still holds the old address</text>
</g>
<g transform="translate(0 250)">
<rect x="0.75" y="0.75" width="228.5" height="234.5" rx="8" fill="none" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="18" cy="18" r="11" fill="#3b82f6"/>
<text x="18" y="22.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">5</text>
<text x="129.0" y="22" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a = NULL;</text>
<text x="56" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">stack</text>
<text x="166" y="50" fill="#8a94a6" font-size="11" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700">heap</text>
<path d="M113 42 L113 184" stroke="#8a94a6" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<text x="10" y="74.0" fill="#f59e0b" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">a</text>
<rect x="58" y="58" width="48" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
<text x="82.0" y="74.32" fill="#f59e0b" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">NULL</text>
<text x="115.0" y="206" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">NULL makes a use-after-free</text>
<text x="115.0" y="221" fill="#8a94a6" font-size="12.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">easy to spot</text>
</g>
</svg>
