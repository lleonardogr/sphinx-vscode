name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read     # to find the CI run of the tagged commit
  id-token: write   # lets azure/login sign in as the Marketplace identity, without a stored token

jobs:
  release:
    runs-on: ubuntu-latest
    # The managed identity's federated credential trusts jobs in this environment.
    environment: marketplace-publish
    env:
      # Optional: when these repository secrets exist, the release is also published to the
      # VS Code Marketplace (AZURE_CLIENT_ID and AZURE_TENANT_ID with Microsoft Entra ID, or the
      # older VSCE_PAT) and to Open VSX (OVSX_PAT). See docs/publishing.md.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # The tag points at a commit on main, which CI already validated in full (every challenge, quiz
      # and notebook, on three systems). Wait for that run instead of validating everything again.
      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              -q '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion) \(.html_url)"')
            case "$run" in
              "completed success "*) echo "CI passed: ${run##* }"; exit 0 ;;
              "completed "*) echo "::error::CI didn't pass for $GITHUB_SHA: $run"; exit 1 ;;
              "") echo "No CI run on main for $GITHUB_SHA yet (attempt $attempt)" ;;
              *) echo "CI is still running: $run (attempt $attempt)" ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA. Re-run this workflow once it passes."
          exit 1

      - run: npm run compile && npm run test:unit

      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a re-run (for example after a failed publish), keep the release and refresh its .vsix.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.vsix \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Code Marketplace (Microsoft Entra ID)
        if: env.AZURE_CLIENT_ID != ''
        run: npx vsce publish --packagePath *.vsix --skip-duplicate --azure-credential

      - name: Publish to the VS Code Marketplace (personal access token)
        if: env.AZURE_CLIENT_ID == '' && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix --skip-duplicate
