name: Marketplace identity

# Run by hand (Actions → Marketplace identity → Run workflow) while setting up publishing with
# Microsoft Entra ID. It signs in as the managed identity and prints the ID the Marketplace
# accepts as a publisher member, then checks whether that identity can already publish.
# See docs/publishing.md.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: ID to add as a member of the Marketplace publisher
        run: |
          # 499b84ac-… is the Azure DevOps resource; the Marketplace knows identities by this profile id.
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: Can it publish to lleonardogr?
        run: npx --yes @vscode/vsce verify-pat lleonardogr --azure-credential
