name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JDK 25 checks both classic and modern (compact source / IO.println) solutions.
        # JDK 17 checks that the classic style still works on the oldest supported JDK.
        include:
          - { os: ubuntu-latest, java: 25 }
          - { os: windows-latest, java: 25 }
          - { os: macos-latest, java: 25 }
          - { os: ubuntu-latest, java: 17 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - run: npm ci

      - name: Compile and validate challenges
        run: npm run validate

      # C challenges use the system's compiler: gcc (Linux), clang (macOS), MinGW gcc without memory checks (Windows).
      - name: C compiler
        run: |
          node -e "require('./out/cRunner').findCCompiler().then((c) => console.log(c ? c.command + ' | ' + c.version + ' | memory checks: ' + c.sanitizers : 'none'))"

      - name: Unit tests
        run: npm run test:unit

      # Starts VS Code with the extension. Needs JDK 25 for the modern starters, and a display
      # (xvfb) on Linux.
      - name: Integration tests
        if: matrix.java == 25
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:integration

  # What Windows students get when they have no C compiler: Sphinx downloads the pinned llvm-mingw.
  portable-c:
    name: Portable C compiler (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Install it with Sphinx's code, and run C with memory checks
        run: node scripts/check-portable-compiler.js

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run package

      - name: The package runs the extension and the sphinx command
        run: |
          unzip -l *.vsix | grep -q 'extension/out/extension.js'
          unzip -l *.vsix | grep -q 'extension/out/cli.js'
          mkdir -p /tmp/vsix && unzip -q -o *.vsix -d /tmp/vsix
          node /tmp/vsix/extension/out/cli.js --version

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
