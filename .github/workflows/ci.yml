name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JDK 25 checks both classic and modern (compact source / IO.println) solutions.
        # JDK 17 checks that the classic style still works on the oldest supported JDK.
        include:
          - { os: ubuntu-latest, java: 25 }
          - { os: windows-latest, java: 25 }
          - { os: macos-latest, java: 25 }
          - { os: ubuntu-latest, java: 17 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - run: npm ci

      - name: Compile and validate challenges
        run: npm run validate

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
